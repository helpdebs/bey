<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Beyoncé Lyric Training</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:linear-gradient(135deg,#fff4cb,#f2dcff,#d7f1ff);
  font-family:Arial,sans-serif;
  min-height:100vh;
  padding:24px;
  color:#1d1d2a;
}

.app{
  max-width:980px;
  margin:auto;
}

.hero,
.card{
  background:white;
  border:3px solid #1d1d2a;
  border-radius:28px;
  padding:24px;
  box-shadow:8px 8px 0 #1d1d2a;
  margin-bottom:24px;
}

h1{
  font-size:44px;
  color:#7c3aed;
  text-shadow:2px 2px 0 #ff8ad8;
  margin-bottom:12px;
}

.subtitle{
  line-height:1.6;
  font-weight:700;
}

.top{
  display:flex;
  justify-content:space-between;
  gap:18px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.song{
  font-size:28px;
  font-weight:900;
}

.meta{
  margin-top:6px;
  color:#7c3aed;
  font-weight:900;
}

.score{
  background:#cfeeff;
  border:3px solid #1d1d2a;
  border-radius:999px;
  padding:10px 18px;
  font-weight:900;
  height:fit-content;
}

.youtube-btn{
  display:inline-block;
  margin-bottom:18px;
  text-decoration:none;
  background:#ff0033;
  color:white;
  border-radius:18px;
  padding:14px 18px;
  border:3px solid #1d1d2a;
  font-weight:900;
  box-shadow:4px 4px 0 #1d1d2a;
}

.video-wrap{
  width:100%;
  aspect-ratio:16/9;
  overflow:hidden;
  border-radius:24px;
  border:3px solid #1d1d2a;
  margin-bottom:22px;
  background:black;
}

iframe{
  width:100%;
  height:100%;
  border:none;
}

.lyric-box{
  background:#f7f0ff;
  border:3px dashed #7c3aed;
  border-radius:24px;
  padding:24px;
  margin-bottom:20px;
}

.previous-line{
  font-size:18px;
  color:#5a4a73;
  margin-bottom:14px;
  font-weight:700;
}

.target-line{
  font-size:34px;
  line-height:1.7;
  font-weight:900;
}

.missing{
  color:#7c3aed;
  letter-spacing:3px;
}

.answers{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-bottom:20px;
}

.answer{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.answer label{
  font-size:14px;
  font-weight:900;
}

.answer input{
  padding:14px;
  border-radius:16px;
  border:3px solid #1d1d2a;
  font-size:16px;
  font-weight:900;
}

.answer input:focus{
  outline:none;
  border-color:#7c3aed;
}

.buttons{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

button{
  border:none;
  cursor:pointer;
  border-radius:18px;
  padding:14px 18px;
  border:3px solid #1d1d2a;
  font-weight:900;
  box-shadow:4px 4px 0 #1d1d2a;
}

.check{
  background:#7c3aed;
  color:white;
}

.hint{
  background:#fff2a0;
}

.next{
  background:#ff8ad8;
}

.reset{
  background:#cfeeff;
}

.feedback,
.hint-box{
  display:none;
  margin-top:16px;
  padding:16px;
  border-radius:18px;
  border:3px solid #1d1d2a;
  font-weight:900;
}

.correct{
  display:block;
  background:#d8ffe8;
  color:#087a3d;
}

.wrong{
  display:block;
  background:#ffe0e7;
  color:#ad1537;
}

.hint-box{
  background:#fff7bf;
}

.progress{
  margin-top:24px;
  border:3px solid #1d1d2a;
  border-radius:24px;
  padding:18px;
}

.bar{
  height:22px;
  border-radius:999px;
  overflow:hidden;
  border:3px solid #1d1d2a;
  margin:10px 0 18px;
}

.fill{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#ff8ad8,#7c3aed);
  transition:.3s;
}

.list{
  display:grid;
  gap:8px;
}

.item{
  background:white;
  border:2px solid #1d1d2a;
  border-radius:14px;
  padding:10px;
  font-weight:800;
}

.item.done{
  background:#d8ffe8;
}

@media(max-width:700px){

  body{
    padding:14px;
  }

  h1{
    font-size:34px;
  }

  .target-line{
    font-size:24px;
  }

}

</style>
</head>

<body>

<main class="app">

<section class="hero">

<h1>Beyoncé Lyric Training</h1>

<p class="subtitle">
Ouça o trecho, entenda o contexto da frase anterior e complete as palavras faltando.
</p>

</section>

<section class="card">

<div class="top">

<div>
<div class="song" id="songTitle"></div>
<div class="meta" id="metaText"></div>
</div>

<div class="score">
Score:
<span id="score">0</span>/<span id="total"></span>
</div>

</div>

<a
id="youtubeBtn"
class="youtube-btn"
target="_blank"
>
Abrir trecho no YouTube
</a>

<div class="video-wrap">

<iframe
id="videoFrame"
allowfullscreen
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
></iframe>

</div>

<div class="lyric-box">

<div class="previous-line" id="previousLine"></div>

<div class="target-line" id="targetLine"></div>

</div>

<div class="answers" id="answersBox"></div>

<div class="buttons">

<button class="check" onclick="checkAnswer()">
Checar resposta
</button>

<button class="hint" onclick="showHint()">
Dica
</button>

<button class="next" onclick="nextQuestion()">
Próxima
</button>

<button class="reset" onclick="resetGame()">
Recomeçar
</button>

</div>

<div class="hint-box" id="hintBox"></div>
<div class="feedback" id="feedback"></div>

<div class="progress">

<strong>Progresso</strong>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

<div class="list" id="progressList"></div>

</div>

</section>

</main>

<script>

const questions = [

{

song:"If I Were a Boy",

structure:"would + phrasal verb",

videoId:"AWpsOqh8q0M",

start:101,

previous:
"And everything you had got destroyed",

target:
"If I * * * my phone",

answers:[
"would",
"turn",
"off"
],

labels:[
"Modal verb",
"Verb",
"Phrasal particle"
],

hint:
"would + phrasal verb"

},

{

song:"If I Were a Boy",

structure:"would + verb",

videoId:"AWpsOqh8q0M",

start:110,

previous:
"I'd listen to her",

target:
"I’d * myself first",

answers:[
"put"
],

labels:[
"Verb"
],

hint:
"I’d = I would"

},

{

song:"Irreplaceable",

structure:"will + verb",

videoId:"2EwViQxSJJQ",

start:113,

previous:
"Don't you ever for a second get to thinking",

target:
"I’ll * another you",

answers:[
"have"
],

labels:[
"Verb"
],

hint:
"I’ll = I will"

}

];

let current = 0;
let score = 0;
let completed = Array(questions.length).fill(false);

const songTitle = document.getElementById("songTitle");
const metaText = document.getElementById("metaText");
const videoFrame = document.getElementById("videoFrame");
const previousLine = document.getElementById("previousLine");
const targetLine = document.getElementById("targetLine");
const answersBox = document.getElementById("answersBox");
const feedback = document.getElementById("feedback");
const hintBox = document.getElementById("hintBox");
const scoreEl = document.getElementById("score");
const totalEl = document.getElementById("total");
const fill = document.getElementById("fill");
const progressList = document.getElementById("progressList");
const youtubeBtn = document.getElementById("youtubeBtn");

totalEl.textContent = questions.length;

function normalize(text){

return text
.trim()
.toLowerCase()
.replace(/[’']/g,"")
.replace(/\s+/g," ");

}

function getYoutubeLink(q){

return `https://www.youtube.com/watch?v=${q.videoId}&t=${q.start}s`;

}

function getEmbedLink(q){

return `https://www.youtube-nocookie.com/embed/${q.videoId}?start=${q.start}&rel=0&modestbranding=1`;

}

function renderQuestion(){

const q = questions[current];

songTitle.textContent = q.song;
metaText.textContent = q.structure;

videoFrame.src = getEmbedLink(q);

youtubeBtn.href = getYoutubeLink(q);

previousLine.textContent = q.previous;

targetLine.innerHTML = q.target.replaceAll(
"*",
`<span class="missing">____</span>`
);

answersBox.innerHTML = "";

q.answers.forEach((answer,index)=>{

const div = document.createElement("div");

div.className = "answer";

div.innerHTML = `
<label>${q.labels[index]}</label>
<input
type="text"
placeholder="Type here..."
autocomplete="off"
/>
`;

answersBox.appendChild(div);

});

feedback.className = "feedback";
feedback.style.display = "none";

hintBox.style.display = "none";
hintBox.textContent = q.hint;

renderProgress();

}

function checkAnswer(){

const q = questions[current];

const inputs = [...answersBox.querySelectorAll("input")];

const correct = inputs.every((input,index)=>{

return normalize(input.value) === normalize(q.answers[index]);

});

if(correct){

feedback.className = "feedback correct";
feedback.style.display = "block";
feedback.textContent = "Perfeito.";

if(!completed[current]){

completed[current] = true;
score++;

}

}else{

feedback.className = "feedback wrong";
feedback.style.display = "block";
feedback.textContent = "Ainda não.";

}

updateScore();
renderProgress();

}

function showHint(){

hintBox.style.display = "block";

}

function nextQuestion(){

current++;

if(current >= questions.length){

current = 0;

}

renderQuestion();

}

function resetGame(){

current = 0;
score = 0;

completed = Array(questions.length).fill(false);

updateScore();
renderQuestion();

}

function updateScore(){

scoreEl.textContent = score;

fill.style.width =
`${(score / questions.length) * 100}%`;

}

function renderProgress(){

progressList.innerHTML = "";

questions.forEach((q,index)=>{

const item = document.createElement("div");

item.className = "item";

if(completed[index]){

item.classList.add("done");

}

item.textContent =
`${index + 1}. ${q.song}`;

progressList.appendChild(item);

});

}

renderQuestion();
updateScore();

</script>

</body>
</html>
