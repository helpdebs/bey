<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beyoncé Lyric Training</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      padding: 24px;
      background: linear-gradient(135deg, #fff3c4, #f3d7ff, #cdeeff);
      color: #191927;
    }

    .app { max-width: 950px; margin: auto; }

    .hero, .card {
      background: white;
      border: 3px solid #191927;
      border-radius: 28px;
      box-shadow: 8px 8px 0 #191927;
      padding: 24px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 42px;
      color: #7c3aed;
      text-shadow: 2px 2px 0 #ff8ad8;
      margin-bottom: 12px;
    }

    .subtitle { font-weight: 700; line-height: 1.5; }

    .top {
      display: flex;
      justify-content: space-between;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .song { font-size: 26px; font-weight: 900; }

    .focus {
      margin-top: 6px;
      color: #7c3aed;
      font-weight: 900;
    }

    .score {
      background: #bde7ff;
      border: 3px solid #191927;
      border-radius: 999px;
      padding: 10px 18px;
      font-weight: 900;
      height: fit-content;
    }

    .youtube-btn {
      display: inline-block;
      background: #ff0033;
      color: white;
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 18px;
      border: 3px solid #191927;
      font-weight: 900;
      box-shadow: 4px 4px 0 #191927;
      margin-bottom: 18px;
    }

    .video-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 3px solid #191927;
      border-radius: 24px;
      overflow: hidden;
      background: #111;
      margin-bottom: 20px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .lyric {
      background: #f5f0ff;
      border: 3px dashed #7c3aed;
      border-radius: 24px;
      padding: 24px;
      font-size: 28px;
      line-height: 1.7;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .context {
      display: block;
      font-size: 20px;
      color: #4b3b66;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .blank {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 100px;
      min-height: 52px;
      border: 3px solid #191927;
      background: white;
      border-radius: 16px;
      margin: 4px;
      color: #7c3aed;
    }

    .answers {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: 3px solid #191927;
      font-weight: 900;
      font-size: 16px;
    }

    .buttons {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    button {
      cursor: pointer;
      padding: 14px 18px;
      border-radius: 18px;
      border: 3px solid #191927;
      font-weight: 900;
      box-shadow: 4px 4px 0 #191927;
    }

    .check { background: #7c3aed; color: white; }
    .hint { background: #fff3a6; }
    .next { background: #ff8ad8; }
    .reset { background: #bde7ff; }

    .feedback, .hint-box {
      display: none;
      margin-top: 16px;
      border-radius: 18px;
      border: 3px solid #191927;
      padding: 16px;
      font-weight: 900;
    }

    .correct { display: block; background: #d8ffe8; color: #087a3d; }
    .wrong { display: block; background: #ffe0e7; color: #ad1537; }
    .hint-box { background: #fff7bf; }

    .progress {
      margin-top: 24px;
      border: 3px solid #191927;
      border-radius: 24px;
      padding: 18px;
    }

    .bar {
      height: 22px;
      border-radius: 999px;
      overflow: hidden;
      border: 3px solid #191927;
      margin: 10px 0 18px;
    }

    .fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff8ad8, #7c3aed);
      transition: .3s;
    }

    .mini { display: grid; gap: 8px; }

    .mini-item {
      border: 2px solid #191927;
      border-radius: 14px;
      padding: 10px;
      background: white;
      font-weight: 800;
    }

    .mini-item.done { background: #d8ffe8; }

    @media(max-width:700px){
      body { padding: 14px; }
      h1 { font-size: 34px; }
      .lyric { font-size: 22px; }
      .context { font-size: 17px; }
      .blank { min-width: 80px; }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="hero">
      <h1>Beyoncé Lyric Training</h1>
      <p class="subtitle">
        Ouça o trecho, complete os gaps e pratique modal verbs com chunks reais.
      </p>
    </section>

    <section class="card">
      <div class="top">
        <div>
          <div class="song" id="songTitle"></div>
          <div class="focus" id="focusText"></div>
        </div>

        <div class="score">
          Score: <span id="score">0</span>/<span id="total"></span>
        </div>
      </div>

      <a id="externalLink" class="youtube-btn" target="_blank">
        Abrir trecho no YouTube
      </a>

      <div class="video-wrap">
        <iframe
          id="videoFrame"
          allowfullscreen
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture">
        </iframe>
      </div>

      <div class="lyric" id="lyricBox"></div>

      <div class="answers" id="answersBox"></div>

      <div class="buttons">
        <button class="check" onclick="checkAnswer()">Checar resposta</button>
        <button class="hint" onclick="showHint()">Dica</button>
        <button class="next" onclick="nextQuestion()">Próxima</button>
        <button class="reset" onclick="resetGame()">Recomeçar</button>
      </div>

      <div class="hint-box" id="hintBox"></div>
      <div class="feedback" id="feedback"></div>

      <div class="progress">
        <strong>Progresso</strong>
        <div class="bar">
          <div class="fill" id="barFill"></div>
        </div>
        <div class="mini" id="miniList"></div>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      {
        song: "If I Were a Boy",
        focus: "would + phrasal verb",
        videoId: "AWpsOqh8q0M",
        start: 54,
        context: "And everything you had got destroyed / If I were a boy",
        lyric: ["I", "GAP", "GAP", "GAP", "my phone"],
        answers: ["would", "turn", "off"],
        hint: "would + phrasal verb"
      },
      {
        song: "If I Were a Boy",
        focus: "would + verb",
        videoId: "AWpsOqh8q0M",
        start: 64,
        context: "Tell everyone it’s broken",
        lyric: ["I’d", "GAP", "myself first"],
        answers: ["put"],
        hint: "I’d = I would"
      },
      {
        song: "Irreplaceable",
        focus: "will + verb",
        videoId: "2EwViQxSJJQ",
        start: 66,
        context: "",
        lyric: ["I’ll", "GAP", "another you"],
        answers: ["have"],
        hint: "I’ll = I will"
      },
      {
        song: "I Was Here",
        focus: "will + verb",
        videoId: "i41qWJ6QjPI",
        start: 74,
        context: "",
        lyric: ["I", "GAP", "GAP", "my mark"],
        answers: ["will", "leave"],
        hint: "will + verbo base"
      },
      {
        song: "Rather Die Young",
        focus: "would rather + verb",
        videoId: "gyxV4yuYfYw",
        start: 36,
        context: "",
        lyric: ["I’d", "GAP", "GAP", "young"],
        answers: ["rather", "die"],
        hint: "I’d rather = I would rather"
      },
      {
        song: "Best Thing I Never Had",
        focus: "will + verb",
        videoId: "FHp2KgyQUFk",
        start: 146,
        context: "",
        lyric: ["I", "GAP", "always", "GAP"],
        answers: ["will", "be"],
        hint: "always pode ficar entre will e verbo"
      }
    ];

    let current = 0;
    let score = 0;
    let completed = Array(questions.length).fill(false);

    const songTitle = document.getElementById("songTitle");
    const focusText = document.getElementById("focusText");
    const videoFrame = document.getElementById("videoFrame");
    const lyricBox = document.getElementById("lyricBox");
    const answersBox = document.getElementById("answersBox");
    const feedback = document.getElementById("feedback");
    const hintBox = document.getElementById("hintBox");
    const scoreEl = document.getElementById("score");
    const totalEl = document.getElementById("total");
    const barFill = document.getElementById("barFill");
    const miniList = document.getElementById("miniList");
    const externalLink = document.getElementById("externalLink");

    totalEl.textContent = questions.length;

    function normalize(text) {
      return text.trim().toLowerCase().replace(/[’']/g, "").replace(/\s+/g, " ");
    }

    function getYoutubeLink(q) {
      return `https://www.youtube.com/watch?v=${q.videoId}&t=${q.start}s`;
    }

    function getEmbedLink(q) {
      return `https://www.youtube-nocookie.com/embed/${q.videoId}?start=${q.start}&rel=0&modestbranding=1`;
    }

    function renderQuestion() {
      const q = questions[current];

      songTitle.textContent = q.song;
      focusText.textContent = q.focus;

      externalLink.href = getYoutubeLink(q);
      videoFrame.src = getEmbedLink(q);

      const contextHtml = q.context
        ? `<span class="context">${q.context}</span>`
        : "";

      const lyricHtml = q.lyric.map(part => {
        return part === "GAP"
          ? `<span class="blank">____</span>`
          : `<span>${part}</span>`;
      }).join(" ");

      lyricBox.innerHTML = contextHtml + lyricHtml;

      answersBox.innerHTML = "";

      q.answers.forEach((_, index) => {
        const input = document.createElement("input");
        input.placeholder = `Gap ${index + 1}`;
        input.autocomplete = "off";

        input.addEventListener("keydown", e => {
          if (e.key === "Enter") checkAnswer();
        });

        answersBox.appendChild(input);
      });

      feedback.className = "feedback";
      feedback.style.display = "none";

      hintBox.style.display = "none";
      hintBox.textContent = q.hint;

      renderProgress();
    }

    function checkAnswer() {
      const q = questions[current];
      const inputs = [...answersBox.querySelectorAll("input")];

      const correct = inputs.every((input, index) => {
        return normalize(input.value) === normalize(q.answers[index]);
      });

      if (correct) {
        feedback.className = "feedback correct";
        feedback.style.display = "block";
        feedback.textContent = "Perfeito.";

        if (!completed[current]) {
          completed[current] = true;
          score++;
        }
      } else {
        feedback.className = "feedback wrong";
        feedback.style.display = "block";
        feedback.textContent = "Ainda não.";
      }

      updateScore();
      renderProgress();
    }

    function showHint() {
      hintBox.style.display = "block";
    }

    function nextQuestion() {
      current = (current + 1) % questions.length;
      renderQuestion();
    }

    function resetGame() {
      current = 0;
      score = 0;
      completed = Array(questions.length).fill(false);
      updateScore();
      renderQuestion();
    }

    function updateScore() {
      scoreEl.textContent = score;
      barFill.style.width = `${(score / questions.length) * 100}%`;
    }

    function renderProgress() {
      miniList.innerHTML = "";

      questions.forEach((q, index) => {
        const item = document.createElement("div");
        item.className = "mini-item";
        if (completed[index]) item.classList.add("done");
        item.textContent = `${index + 1}. ${q.song}`;
        miniList.appendChild(item);
      });
    }

    renderQuestion();
    updateScore();
  </script>
</body>
</html>
